<source>
  @type tail
  path /var/log/*.log
  tag system.logs
  pos_file /var/log/fluentd-system.pos
  format none
</source>

<source>
  @type tail
  path /var/lib/docker/containers/*/*.log
  tag docker.logs
  pos_file /var/log/fluentd-docker.pos
  format json
</source>

<match *.logs>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  include_tag_key true
  type_name fluentd
  logstash_prefix fluentd
</match>
